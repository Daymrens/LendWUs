name: sinking_fund_app
description: A mobile app for managing group sinking funds
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  go_router: ^13.0.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  gap: ^3.0.1
  cached_network_image: ^3.3.1
  qr_flutter: ^4.1.0
  image_picker: ^1.0.7
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^18.0.0
  share_plus: 12.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
